<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · FoodBridge</title>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">FoodBridge</a>
    {% if g.user %}
      {% if g.user.role == 'admin' %}<a href="{{ url_for('admin.accounts') }}">Accounts</a>{% endif %}
      <span>{{ g.user.org_name }} ({{ g.user.role }}, {{ g.user.status }})</span>
      <form action="{{ url_for('auth.logout') }}" method="post" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.register') }}">Register</a>
      <a href="{{ url_for('auth.login') }}">Log in</a>
    {% endif %}
  </nav>
  {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
